
name: NetDoctor CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Run frontend logic tests
        run: |
          $tests = @(
            Get-ChildItem -LiteralPath "ui/src" -Recurse -File -Filter "*.test.mjs" |
            ForEach-Object { $_.FullName }
          )

          if ($tests.Count -eq 0) {
            throw "No JavaScript tests found."
          }

          node --test $tests

          if ($LASTEXITCODE -ne 0) {
            throw "JavaScript tests failed."
          }

      - name: Check browser-native dialogs
        run: |
          $matches = @(
            Get-ChildItem -LiteralPath "ui/src" -Recurse -File |
            Where-Object {
              $_.Extension -in @(".js", ".jsx", ".mjs", ".ts", ".tsx")
            } |
            Select-String -Pattern '\b(?:window\.)?(?:confirm|alert|prompt)\s*\('
          )

          if ($matches.Count -gt 0) {
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

            throw "Native browser dialogs remain."
          }

      - name: Build React frontend
        working-directory: ui
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,desktop]"

      - name: Validate Python dependencies
        run: python -m pip check

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check source desktop bundle
        run: |
          $report = Join-Path $env:RUNNER_TEMP "netdoctor-source-smoke.json"

          python -m netdoctor.packaged_main --smoke-report $report

          if ($LASTEXITCODE -ne 0) {
            throw "Source bundle smoke check failed."
          }

          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json

          if (-not $result.ok) {
            throw "Source bundle smoke report was not successful."
          }
