[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netdoctor"
version = "0.1.0"
description = "Evidence-first network diagnostic tool for Windows"
requires-python = ">=3.12"
dependencies = ["rich>=13.7,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
netdoctor = "netdoctor.cli:main"

[project.gui-scripts]
netdoctor-desktop = "netdoctor.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"